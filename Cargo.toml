[package]
name = "backend"
version = "0.1.0"
edition = "2024"
default-run = "exchange_server"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[dependencies]
fixed = { version = "1.31.0", features = ["serde"] }
rand = "0.10.1"
thiserror = "2.0.18"
tokio = { version = "1.51.0", features = ["full"] }
num-format = "0.4.4"
criterion = { version = "0.8.2", features = ["async", "async_futures", "async_tokio"] }
hashbrown = "0.17.1"
ringbuf = "0.5.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
rmp-serde = "1.3.1"
serde = { version = "1.0.228", features = ["serde_derive"] }
tokio-util = { version = "0.7.18", features = ["codec"] }
bytes = "1.12.0"
tokio-stream = "0.1.18"
futures-util = "0.3.32"

[[bin]]
name = "bench_insert_orders_manual"
path = "benches/insert_orders_manual.rs"

[[bin]]
name = "playground"
path = "src/bin/playground.rs"

[[bench]]
name = "insert_order"
harness = false

[profile.profiling]
opt-level = 3
inherits = "release"
debug = true
